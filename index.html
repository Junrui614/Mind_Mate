<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate - Your 24/7 AI Companion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>MindMate</h1>
        <p>Feel heard. Get support. Your private 24/7 AI companion for managing stress.</p>
    </header>
    <main>
        <section id="chatbot">
            <div id="chat-window"></div>
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="How are you feeling today?" autocomplete="off" required />
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
    <script src="js/app.js"></script>

</html>
